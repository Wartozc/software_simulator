server:
  port: ${PORT:8080}

spring:
  application:
    name: ${APP_NAME:Software_simulator}
  webflux:
    base-path: ${BASE_PATH:api/v1/simulator}
  profiles:
    include: ${ENV:local}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

Management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /

springdoc:
  swagger-ui:
    path: doc/swagger-ui/index.html
  api-docs:
    path: doc/api-docs